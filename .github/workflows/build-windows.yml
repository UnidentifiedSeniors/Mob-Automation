name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build App (onedir)
        run: pyinstaller --noconfirm --clean --windowed --name GameBot --collect-all PyQt6 --add-data "*.png;." --icon=icon.ico ui_pyqt6_windows.py

      - name: Show dist contents (debug)
        shell: powershell
        run: Get-ChildItem -Path dist -Recurse

      - name: Package onedir build
        shell: powershell
        run: |
          $zipPath = "GameBot-windows-onedir.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "dist/GameBot/*" -DestinationPath $zipPath -Force

      - name: Generate SHA256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -Path GameBot-windows-onedir.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  GameBot-windows-onedir.zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Mob Automation ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload_release_asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: GameBot-windows-onedir.zip
          asset_name: GameBot-windows-onedir.zip
          asset_content_type: application/zip

      - name: Upload SHA256 checksum asset
        id: upload_checksum_asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: SHA256SUMS.txt
          asset_name: SHA256SUMS.txt
          asset_content_type: text/plain
